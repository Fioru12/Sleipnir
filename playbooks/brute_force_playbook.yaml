name: "Asgard Suite Automated SOC Playbook"
description: "Orchestrates Fenrir (Threat Intel), Heimdall (HIDS), Mjolnir (Triage), Bifrost (Network Scan), and Yggdrasil (AD Audit) into a unified incident response workflow."

trigger: "SECURITY_INCIDENT"

steps:
  - name: "Step 1: Update Threat Intel (Fenrir)"
    action: "fenrir_update"
    params: {}

  - name: "Step 2: Run HIDS Log Analysis & Simulation (Heimdall)"
    action: "heimdall_simulate"
    params: {}

  - name: "Step 3: Execute Live Host Forensic Triage (Mjolnir)"
    action: "mjolnir_run_triage"
    params: {}

  - name: "Step 4: Perform Network Scan & Enrichment (Bifrost)"
    action: "bifrost_scan"
    params: {}

  - name: "Step 5: Run Active Directory Security Audit (Yggdrasil)"
    action: "yggdrasil_audit"
    params: {}
